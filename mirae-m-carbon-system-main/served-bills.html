<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Billing — M-Carbon Billing System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="rail"></aside>
  <main>
    <div class="page-head">
      <div>
        <h1>Billing</h1>
        <p>Every billing period, from first draft through to the issued statement.</p>
      </div>
      <button class="primary" id="new" data-edit>Start a billing period</button>
    </div>

    <div class="panel" id="new-panel" hidden>
      <header><h2>New billing period</h2></header>
      <div class="body">
        <form id="form">
          <div class="grid2">
            <div class="field"><label for="project">Project site</label><select id="project" required></select></div>
            <div class="field"><label for="method">Baseline calculation method</label>
              <select id="method">
                <option value="">Use the project’s configured method</option>
                <option value="fixed">1 — Dashboard fixed baseline</option>
                <option value="savings_pct">2 — Agreed savings percentage</option>
                <option value="operating_hours">3 — Actual operating hours per day</option>
              </select>
            </div>
            <div class="field"><label for="start">Data collection period — from</label><input id="start" type="date" required></div>
            <div class="field"><label for="end">Data collection period — to</label><input id="end" type="date" required></div>
          </div>
          <div class="actions">
            <button class="primary" type="submit">Create draft</button>
            <button type="button" id="cancel">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <div class="panel">
      <div class="body">
        <div class="inline-form">
          <div><label for="fstatus">Stage</label><select id="fstatus"><option value="">All stages</option></select></div>
          <div><label for="ffrom">Period from</label><input id="ffrom" type="date"></div>
          <div><label for="fto">Period to</label><input id="fto" type="date"></div>
        </div>
      </div>
    </div>

    <div class="panel"><div class="table-wrap" id="list"></div></div>
  </main>
</div>
<script src="/js/app.js"></script>
<script>
let me;

async function load() {
  const p = new URLSearchParams();
  if (fstatus.value) p.set('status', fstatus.value);
  if (ffrom.value) p.set('from', ffrom.value);
  if (fto.value) p.set('to', fto.value);
  const { bills, labels } = await api('/api/bills?' + p);
  if (fstatus.options.length === 1) {
    Object.entries(labels).forEach(([k, v]) => fstatus.add(new Option(v, k)));
  }
  document.getElementById('list').innerHTML = bills.length ? `<table>
    <thead><tr><th>Statement</th><th>Client / site</th><th>Period</th><th>Stage</th>
      <th class="num">Savings</th><th class="num">Billed</th><th class="num">Balance</th><th></th></tr></thead>
    <tbody>${bills.map((b) => `<tr>
      <td><a href="/bill.html?id=${b.id}">${esc(b.statement_no)}</a>${b.revises_bill_id ? ' <span class="pill draft">revision</span>' : ''}</td>
      <td>${esc(b.client_name)}<br><span style="color:var(--ink-soft);font-size:.82rem">${esc(b.project_name)}</span></td>
      <td>${dateText(b.period_start)} – ${dateText(b.period_end)}</td>
      <td><span class="pill ${b.status}">${esc(b.status_label)}</span></td>
      <td class="num">${kwh(b.energy_savings_kwh, 0)}</td>
      <td class="num">${money(b.amount_billed)}</td>
      <td class="num">${money(b.total_due)}</td>
      <td class="num">${removeCell(b, me)}</td>
      </tr>`).join('')}</tbody></table>`
    : '<div class="empty">No billing periods match these filters.</div>';
  if (readOnly(me)) disableEditing();
}

function removeCell(b, me) {
  if (b.status === 'void') return '';
  if (['final', 'issued'].includes(b.status)) {
    return `<button class="quiet" disabled title="Final and issued bills can’t be removed — open it and create a revision instead.">Remove</button>`;
  }
  if (me?.role !== 'admin') {
    return `<button class="quiet" disabled title="Only an administrator can remove a billing period.">Remove</button>`;
  }
  return `<button class="quiet danger" data-edit onclick="removeBill(${b.id}, ${JSON.stringify(b.statement_no)})">Remove</button>`;
}

async function removeBill(id, statementNo) {
  const reason = prompt(`Remove ${statementNo}? This voids it — the record stays for the audit trail but drops off pending lists and totals. Give a reason:`);
  if (reason === null) return;
  if (!reason.trim()) return toast('A reason is required to remove a bill.', true);
  try {
    await api(`/api/bills/${id}/status`, { method: 'POST', body: { status: 'void', reason: reason.trim() } });
    toast('Billing period removed');
    await load();
  } catch (e) { toast(e.message, true); }
}

document.getElementById('new').onclick = () => {
  document.getElementById('new-panel').hidden = false;
  document.getElementById('project').focus();
};
document.getElementById('cancel').onclick = () => (document.getElementById('new-panel').hidden = true);

document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();
  try {
    const { id } = await api('/api/bills', { method: 'POST', body: {
      project_id: Number(document.getElementById('project').value),
      period_start: document.getElementById('start').value,
      period_end: document.getElementById('end').value,
      baseline_method: document.getElementById('method').value || undefined
    }});
    location.href = '/bill.html?id=' + id;
  } catch (err) { toast(err.message, true); }
};

[fstatus, ffrom, fto].forEach((el) => (el.onchange = load));

(async () => {
  me = await shell();
  if (readOnly(me)) disableEditing();
  const { projects } = await api('/api/projects');
  const sel = document.getElementById('project');
  projects.forEach((p) => sel.add(new Option(`${p.client_name} — ${p.name}`, p.id)));

  // Default to last month, which is the usual billing period.
  const now = new Date();
  const first = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const last = new Date(now.getFullYear(), now.getMonth(), 0);
  document.getElementById('start').value = first.toISOString().slice(0, 10);
  document.getElementById('end').value = last.toISOString().slice(0, 10);

  await load();
})().catch((e) => toast(e.message, true));
</script>
</body>
</html>
