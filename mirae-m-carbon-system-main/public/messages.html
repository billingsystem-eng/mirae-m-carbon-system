<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messages — M-Carbon System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
<div class="shell">
  <aside class="rail"></aside>
  <main>
    <div class="page-head">
      <div>
        <h1>Messages</h1>
        <p id="sub">Payment conversations between clients and Mirae ESP finance. Each conversation belongs to one issued statement.</p>
      </div>
    </div>

    <div class="msgs-layout" id="layout">
      <section class="panel msgs-list" aria-label="Conversations">
        <header>
          <label class="sr-only" for="q">Search conversations</label>
          <input id="q" type="search" placeholder="Search by statement, client or project">
        </header>
        <div id="threads" class="msgs-threads"></div>
      </section>

      <section class="panel msgs-thread" aria-label="Conversation">
        <header class="msgs-thread-head" id="th-head">
          <h2>Select a conversation</h2>
        </header>
        <div class="body" id="chat-body">
          <p class="chat-empty" id="th-empty">Pick a statement on the left to read or send messages about its payment.</p>
        </div>
      </section>
    </div>
  </main>
</div>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script src="/js/chat.js"></script>
<script>
const g = (x) => document.getElementById(x);
let me, threads = [], activeKey = null;
const keyOf = (t) => t.bill_id + ':' + t.client_user_id;   // one conversation per bill and client login

// "5 min ago", "Yesterday", or a short date: enough to scan a list.
function ago(ts) {
  if (!ts) return '';
  const d = new Date(String(ts).replace(' ', 'T') + 'Z');
  if (isNaN(d)) return '';
  const mins = Math.floor((Date.now() - d.getTime()) / 60000);
  if (mins < 1) return 'now';
  if (mins < 60) return mins + ' min';
  if (d.toDateString() === new Date().toDateString()) return d.toLocaleTimeString(LOCALE(), { hour: 'numeric', minute: '2-digit' });
  return d.toLocaleDateString(LOCALE(), { day: 'numeric', month: 'short' });
}

function renderList() {
  const q = g('q').value.trim().toLowerCase();
  const mySide = me.role === 'viewer' ? 'client' : 'staff';
  const rows = threads.filter((t) => !q ||
    [t.statement_no, t.client_name, t.project_name, t.client_user_name].some((v) => String(v || '').toLowerCase().includes(q)));
  g('threads').innerHTML = rows.length ? rows.map((t) => {
    const preview = t.last_snippet
      ? (t.last_side === mySide ? 'You: ' : '') + t.last_snippet
      : 'No messages yet';
    // Staff see which client login each conversation is with; a client only ever sees its own.
    const who = me.role === 'viewer'
      ? esc(t.client_name) + (t.project_name ? ' · ' + esc(t.project_name) : '')
      : esc(t.client_user_name) + ' · ' + esc(t.client_name);
    return `<button type="button" class="thread-item${keyOf(t) === activeKey ? ' on' : ''}${t.unread ? ' unread' : ''}" data-key="${esc(keyOf(t))}">
      <span class="ti-top"><b>${esc(t.statement_no)}</b><span class="ti-time">${esc(ago(t.last_at))}</span></span>
      <span class="ti-who">${who}</span>
      <span class="ti-bot"><span class="ti-snip${t.last_snippet ? '' : ' none'}">${esc(preview)}</span>${t.unread ? `<span class="nav-badge">${t.unread > 99 ? '99+' : t.unread}</span>` : ''}</span>
    </button>`;
  }).join('')
  : `<p class="chat-empty" style="padding:18px">${threads.length
      ? 'No conversation matches your search.'
      : (me.role === 'viewer'
          ? 'Messages open once a statement has been issued to you.'
          : 'No issued statements yet.')}</p>`;
  g('threads').querySelectorAll('.thread-item').forEach((b) => { b.onclick = () => openThread(b.dataset.key); });
}

async function loadThreads() {
  try {
    const d = await api('/api/messages/threads');
    threads = d.threads;
    renderList();
    setMessageBadge(d.total_unread);
  } catch (e) { /* the next refresh tries again */ }
}

function openThread(key) {
  const t = threads.find((x) => keyOf(x) === key);
  if (!t) return;
  activeKey = key;
  history.replaceState(null, '', '?bill=' + t.bill_id + '&user=' + t.client_user_id);
  g('layout').classList.add('show-thread');
  g('th-head').innerHTML = `
    <div>
      <button type="button" class="quiet msgs-back" id="back">← All conversations</button>
      <h2>${esc(t.statement_no)} · ${esc(me.role === 'viewer' ? t.client_name : t.client_user_name + ' (' + t.client_name + ')')}</h2>
      <p class="msgs-sub">${t.project_name ? esc(t.project_name) + ' · ' : ''}${dateText(t.period_start)} – ${dateText(t.period_end)}
        · ${t.balance_due > 0 ? 'Balance due <b>' + money(t.balance_due) + '</b>' + (t.due_date ? ', due ' + dateText(t.due_date) : '') : 'Paid in full'}</p>
    </div>
    <a class="btn" href="/bill.html?id=${t.bill_id}">View statement</a>`;
  g('back').onclick = () => { g('layout').classList.remove('show-thread'); };
  BillChat.mount(g('chat-body'), {
    billId: t.bill_id,
    threadUserId: me.role === 'viewer' ? undefined : t.client_user_id,   // a client login is always its own conversation
    isClient: me.role === 'viewer',
    onChange: loadThreads
  });
  renderList();
}

(async () => {
  me = await shell();
  g('q').oninput = renderList;
  await loadThreads();
  const qs = new URLSearchParams(location.search);
  const wantBill = Number(qs.get('bill')), wantUser = Number(qs.get('user'));
  const want = threads.find((t) => t.bill_id === wantBill && (me.role === 'viewer' || t.client_user_id === wantUser));
  if (want) openThread(keyOf(want));
  // New conversations and unread counts on the other threads: refresh the list while the tab is open.
  setInterval(() => { if (document.visibilityState === 'visible') loadThreads(); }, 10000);
})().catch((e) => toast(e.message, true));
</script>
</body>
</html>
