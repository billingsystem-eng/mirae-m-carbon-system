<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client — M-Carbon System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
<div class="shell">
  <aside class="rail"></aside>
  <main>
    <div class="page-head">
      <div>
        <div class="crumb"><a href="/clients.html">Clients</a></div>
        <h1 id="title">Client</h1>
        <p id="sub"></p>
      </div>
      <div class="actions"><button class="primary" id="save" data-edit>Save changes</button></div>
    </div>

    <div class="split">
      <div>
        <div class="panel">
          <header><h2>Account details</h2></header>
          <div class="body">
            <div class="grid3">
              <div class="field"><label for="account_no">Account number</label><input id="account_no" data-f data-edit></div>
              <div class="field"><label for="name">Client name</label><input id="name" data-f data-edit></div>
              <div class="field"><label for="tin">Business registration no.</label><input id="tin" data-f data-edit></div>
              <div class="field"><label for="status">Account status</label><select id="status" data-f data-edit></select></div>
            </div>
            <h3 style="margin:10px 0 8px">Billing address</h3>
            <div class="grid3">
              <div class="field"><label for="addr_zip">Postal code</label><input id="addr_zip" data-f data-edit></div>
              <div class="field"><label for="addr_region">Province / metropolitan city</label><input id="addr_region" data-f data-edit></div>
              <div class="field"><label for="addr_city">City / county / district</label><input id="addr_city" data-f data-edit></div>
              <div class="field"><label for="addr_street">Road name address</label><input id="addr_street" data-f data-edit></div>
              <div class="field"><label for="addr_unit">Detailed address (building no., unit)</label><input id="addr_unit" data-f data-edit></div>
              <div class="field"><label for="addr_building">Building name</label><input id="addr_building" data-f data-edit></div>
              <div class="field"><label for="addr_barangay">Neighborhood (eup/myeon/dong)</label><input id="addr_barangay" data-f data-edit></div>
              <div class="field"><label for="addr_country">Country</label><input id="addr_country" data-f data-edit></div>
            </div>
            <div class="field"><label for="notes">Notes</label><textarea id="notes" data-f data-edit></textarea></div>
          </div>
        </div>

        <div class="panel">
          <header>
            <h2>Project sites</h2>
            <button id="add-project" data-edit>Add site</button>
          </header>
          <div id="projects"></div>
          <div class="body" id="project-form" hidden>
            <form id="pform">
              <div class="grid2">
                <div class="field"><label for="p-name">Project or site name</label><input id="p-name" required></div>
                <div class="field"><label for="p-address">Site address</label><input id="p-address" placeholder="If different from the billing address"></div>
                <div class="field"><label for="p-type">Lighting type</label><input id="p-type" list="lighting-types" placeholder="T8 with IoT"><datalist id="lighting-types"></datalist><small style="display:block;color:var(--ink-soft);font-size:.78rem;margin-top:3px">Pick a suggestion or type your own</small></div>
                <div class="field"><label for="p-qty">Lighting quantity</label><input id="p-qty" type="number" min="0"></div>
                <div class="field"><label for="p-ob">Operating brightness</label><input id="p-ob" placeholder="e.g. 100%"></div>
                <div class="field"><label for="p-sb">Energy-saving brightness</label><input id="p-sb" placeholder="e.g. 40%"></div>
              </div>
              <div class="actions">
                <button class="primary" type="submit">Save site</button>
                <button type="button" id="p-cancel">Cancel</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div>
        <div class="panel">
          <header><h2>Contacts</h2></header>
          <div id="contacts"></div>
          <div class="body">
            <form id="cform">
              <div class="grid2">
                <div class="field"><label for="ct-name">Name</label><input id="ct-name" required data-edit></div>
                <div class="field"><label for="ct-position">Position or role</label><input id="ct-position" data-edit></div>
                <div class="field"><label for="ct-phone">Contact number</label><input id="ct-phone" data-edit></div>
                <div class="field"><label for="ct-email">Email address</label><input id="ct-email" type="email" data-edit></div>
              </div>
              <label style="display:flex;gap:8px;align-items:center">
                <input type="checkbox" id="ct-primary" style="width:auto" data-edit> Primary contact
              </label>
              <div class="actions" style="margin-top:10px"><button type="submit" data-edit>Add contact</button></div>
            </form>
          </div>
        </div>

        <div class="panel">
          <header><h2>Recent statements</h2></header>
          <div id="bills"></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
const FIELDS = ['account_no','name','tin','status','addr_unit','addr_building','addr_street','addr_barangay','addr_city','addr_region','addr_country','addr_zip','notes'];
let client, me;

async function load() {
  client = await api('/api/clients/' + id);
  const { statuses } = await api('/api/clients');
  const sel = document.getElementById('status');
  if (!sel.options.length) statuses.forEach((s) => sel.add(new Option(s, s)));

  document.getElementById('title').textContent = client.name;
  document.getElementById('sub').textContent = `Account ${client.account_no} · ${client.projects.length} site(s)`;
  document.title = client.name + ' — M-Carbon Billing System';
  FIELDS.forEach((f) => (document.getElementById(f).value = client[f] ?? ''));

  document.getElementById('projects').innerHTML = client.projects.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Site</th><th>Lighting</th><th class="num">Fixtures</th><th>Baseline method</th></tr></thead>
      <tbody>${client.projects.map((p) => `<tr>
        <td><a href="/project.html?id=${p.id}">${esc(p.name)}</a></td>
        <td>${esc(p.lighting_type || '—')}</td>
        <td class="num">${p.lighting_qty ?? '—'}</td>
        <td>${({fixed:'Dashboard fixed baseline',savings_pct:'Agreed savings percentage',operating_hours:'Actual operating hours'})[p.contract?.baseline_method] || 'Not configured'}</td>
      </tr>`).join('')}</tbody></table></div>`
    : '<div class="empty">No project sites yet. Add one before you can bill this client.</div>';

  document.getElementById('contacts').innerHTML = client.contacts.length ? `<div class="table-wrap"><table>
      <tbody>${client.contacts.map((c) => `<tr>
        <td><b>${esc(c.name)}</b>${c.is_primary ? ' <span class="pill approved">Primary</span>' : ''}
          <br><span style="color:var(--ink-soft);font-size:.83rem">${esc(c.position || '')}</span></td>
        <td>${esc(c.phone || '')}<br><span style="font-size:.83rem">${esc(c.email || '')}</span></td>
        <td class="num"><button class="quiet danger" data-edit onclick="removeContact(${c.id})">Remove</button></td>
      </tr>`).join('')}</tbody></table></div>`
    : '<div class="empty">No contacts recorded.</div>';

  const { bills } = await api('/api/bills?client_id=' + id);
  document.getElementById('bills').innerHTML = bills.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Statement</th><th>Period</th><th>Stage</th><th class="num">Billed</th></tr></thead>
      <tbody>${bills.slice(0, 10).map((b) => `<tr>
        <td><a href="/bill.html?id=${b.id}">${esc(b.statement_no)}</a></td>
        <td>${dateText(b.period_start)} – ${dateText(b.period_end)}</td>
        <td><span class="pill ${b.status}">${esc(b.status_label)}</span></td>
        <td class="num">${money(b.amount_billed)}</td></tr>`).join('')}</tbody></table></div>`
    : '<div class="empty">No statements yet.</div>';

  if (readOnlySetup(me)) disableEditing();
}

async function removeContact(cid) {
  if (!confirm('Remove this contact?')) return;
  try { await api(`/api/clients/${id}/contacts/${cid}`, { method: 'DELETE' }); await load(); }
  catch (e) { toast(e.message, true); }
}

document.getElementById('save').onclick = async () => {
  const body = {};
  FIELDS.forEach((f) => (body[f] = document.getElementById(f).value));
  try { await api('/api/clients/' + id, { method: 'PATCH', body }); toast('Saved'); await load(); }
  catch (e) { toast(e.message, true); }
};

document.getElementById('cform').onsubmit = async (e) => {
  e.preventDefault();
  try {
    await api(`/api/clients/${id}/contacts`, {
      method: 'POST',
      body: {
        name: document.getElementById('ct-name').value.trim(),
        position: document.getElementById('ct-position').value,
        phone: document.getElementById('ct-phone').value,
        email: document.getElementById('ct-email').value,
        is_primary: document.getElementById('ct-primary').checked
      }
    });
    e.target.reset();
    await load();
  } catch (err) { toast(err.message, true); }
};

document.getElementById('add-project').onclick = () => {
  document.getElementById('project-form').hidden = false;
  document.getElementById('p-name').focus();
};
document.getElementById('p-cancel').onclick = () => (document.getElementById('project-form').hidden = true);

document.getElementById('pform').onsubmit = async (e) => {
  e.preventDefault();
  try {
    const { id: pid } = await api('/api/projects', {
      method: 'POST',
      body: {
        client_id: Number(id),
        name: document.getElementById('p-name').value.trim(),
        address: document.getElementById('p-address').value,
        lighting_type: document.getElementById('p-type').value,
        lighting_qty: document.getElementById('p-qty').value || null,
        operating_brightness: document.getElementById('p-ob').value,
        saving_brightness: document.getElementById('p-sb').value
      }
    });
    location.href = '/project.html?id=' + pid;
  } catch (err) { toast(err.message, true); }
};

(async () => {
  me = await shell();
  const { lighting_types } = await api('/api/projects');
  document.getElementById('lighting-types').innerHTML = lighting_types.map((t) => `<option value="${esc(t)}">`).join('');
  await load();
})().catch((e) => toast(e.message, true));
</script>
</body>
</html>
