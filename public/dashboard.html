<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overview — M-Carbon System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
<div class="shell">
  <aside class="rail"></aside>
  <main>
    <div class="page-head">
      <div>
        <h1>Overview</h1>
        <p>Billing, savings and collection across every M-Carbon project.</p>
      </div>
      <a class="btn primary" href="/bills.html">Start a billing period</a>
    </div>

    <div class="stat-row" id="stats"></div>

    <div class="split">
      <div class="panel">
        <header><h2>Needs attention</h2><span id="pending-count" style="color:var(--ink-soft);font-size:.85rem"></span></header>
        <div id="pending"></div>
      </div>
      <div class="panel">
        <header><h2>Overdue accounts</h2></header>
        <div id="overdue"></div>
      </div>
    </div>

    <div class="charts">
      <div class="panel">
        <header><h2>Overall account status</h2><span id="status-total" style="color:var(--ink-soft);font-size:.85rem"></span></header>
        <div class="body" id="status-body"></div>
      </div>
      <div class="panel">
        <header>
          <h2>Energy savings and billing</h2>
          <div class="seg" role="group" aria-label="Energy savings view">
            <button type="button" class="on" data-mode="cum" aria-pressed="true">Cumulative</button>
            <button type="button" data-mode="month" aria-pressed="false">Monthly</button>
          </div>
        </header>
        <div class="body" id="bar-body"></div>
      </div>
    </div>
  </main>
</div>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script src="/js/vendor/chart.umd.js"></script>
<script>
const STATUS_COLORS = {
  'Ongoing Data Collection': '#3f7fb0',
  'Billed': '#0c6b5a',
  'Paid': '#86b56b',
  'Overdue': '#b5462f',
  'Suspended': '#d19a2a',
  'Project Complete': '#8a9a95'
};
const FALLBACK_COLOR = '#b9c4bf';
const monthName = (ym) => new Date(ym + '-01T00:00:00').toLocaleDateString(LOCALE(), { month: 'short', year: 'numeric' });
const compactNum = new Intl.NumberFormat(LOCALE(), { notation: 'compact', maximumFractionDigits: 1 });

function statusChart(rows) {
  const total = rows.reduce((t, r) => t + r.n, 0);
  document.getElementById('status-total').textContent = total ? `${total} ${total === 1 ? 'client' : 'clients'}` : '';
  const body = document.getElementById('status-body');
  if (!total) { body.innerHTML = '<div class="empty">No clients yet. Add one under Clients &amp; projects.</div>'; return; }

  body.innerHTML = `<div class="status-wrap">
      <div class="status-pie"><canvas id="pie" role="img" aria-label="Pie chart of client accounts by status"></canvas></div>
      <ul class="legend">${rows.map((r) => `<li class="${r.n ? '' : 'zero'}">
        <i style="background:${STATUS_COLORS[r.status] || FALLBACK_COLOR}"></i><span>${esc(r.status)}</span>
        <span class="n">${r.n} <small>(${Math.round((r.n / total) * 100)}%)</small></span></li>`).join('')}</ul>
    </div>`;

  new Chart(document.getElementById('pie'), {
    type: 'pie',
    data: {
      labels: rows.map((r) => r.status),
      datasets: [{
        data: rows.map((r) => r.n),
        backgroundColor: rows.map((r) => STATUS_COLORS[r.status] || FALLBACK_COLOR),
        borderColor: '#fff', borderWidth: rows.filter((r) => r.n > 0).length > 1 ? 2 : 0
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: (c) => ` ${c.label}: ${c.parsed} (${Math.round((c.parsed / total) * 100)}%)` } }
      }
    }
  });
}

function barChart(monthly) {
  const body = document.getElementById('bar-body');
  if (!monthly.length) {
    body.innerHTML = '<div class="empty">Issue a statement and the monthly totals appear here.</div>';
    document.querySelector('.seg').hidden = true;
    return;
  }
  body.innerHTML = '<div class="chart-box"><canvas id="bar" role="img" aria-label="Bar chart of energy savings in kilowatt-hours and amount billed in pesos, by month"></canvas></div>';

  let mode = 'cum';
  const energy = () => monthly.map((m) => (mode === 'cum' ? m.cum_kwh : m.kwh));
  const energyLabel = () => (mode === 'cum' ? 'Cumulative energy savings (kWh)' : 'Monthly energy savings (kWh)');

  const chart = new Chart(document.getElementById('bar'), {
    type: 'bar',
    data: {
      labels: monthly.map((m) => monthName(m.month)),
      datasets: [
        { label: energyLabel(), data: energy(), yAxisID: 'kwh', backgroundColor: '#3f7fb0', borderRadius: 2 },
        { label: 'Monthly billing (₱)', data: monthly.map((m) => m.billed), yAxisID: 'php', backgroundColor: '#0c6b5a', borderRadius: 2 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 12, boxHeight: 12 } },
        tooltip: { callbacks: { label: (c) => ` ${c.dataset.label}: ${c.dataset.yAxisID === 'kwh' ? kwh(c.parsed.y, 0) : money(c.parsed.y)}` } }
      },
      scales: {
        x: { grid: { display: false } },
        kwh: { position: 'left', beginAtZero: true, title: { display: true, text: 'kWh' }, ticks: { callback: (v) => compactNum.format(v) } },
        php: { position: 'right', beginAtZero: true, title: { display: true, text: 'Billing (₱)' }, grid: { drawOnChartArea: false }, ticks: { callback: (v) => compactNum.format(v) } }
      }
    }
  });

  document.querySelectorAll('.seg button').forEach((btn) => {
    btn.onclick = () => {
      mode = btn.dataset.mode;
      document.querySelectorAll('.seg button').forEach((b) => {
        const on = b === btn;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', on);
      });
      chart.data.datasets[0].data = energy();
      chart.data.datasets[0].label = energyLabel();
      chart.update();
    };
  });
}

(async () => {
  await shell();
  const d = await api('/api/reports/overview');

  document.getElementById('stats').innerHTML = [
    ['Active clients', d.clients, `${d.projects} project sites`],
    ['Energy saved', kwh(d.total_kwh_saved, 0), 'across issued statements'],
    ['Billed to clients', money(d.total_billed), `${d.statements} statements`],
    ['Collected', money(d.total_collected), 'recorded payments'],
    ['Outstanding', money(d.outstanding), 'unpaid balance']
  ].map(([label, value, sub]) => `<div class="stat"><b>${value}</b><span>${label} — ${sub}</span></div>`).join('');

  const pending = document.getElementById('pending');
  const qp = d.quotes_pending || [];
  const QL = { for_review: 'For review', approved: 'Accepted', declined: 'Declined' };
  const QPILL = { for_review: 'for_review', approved: 'approved', declined: 'void' };
  const QNOTE = { for_review: 'Waiting for Finance / HR', approved: 'Finance / HR to send to client', declined: 'Billing officer to fix' };
  document.getElementById('pending-count').textContent = d.pending.length + qp.length ? `${d.pending.length + qp.length} open` : '';
  const billsHtml = d.pending.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Statement</th><th>Client</th><th>Period</th><th>Stage</th><th class="num">Amount</th></tr></thead>
      <tbody>${d.pending.map((b) => `<tr>
        <td><a href="/bill.html?id=${b.id}">${esc(b.statement_no)}</a></td>
        <td>${esc(b.client_name)}<br><span style="color:var(--ink-soft);font-size:.82rem">${esc(b.project_name)}</span></td>
        <td>${dateText(b.period_start)} – ${dateText(b.period_end)}</td>
        <td><span class="pill ${b.status}">${esc(b.status.replace('_', ' '))}</span></td>
        <td class="num">${money(b.amount_billed)}</td></tr>`).join('')}</tbody></table></div>` : '';
  const quotesHtml = qp.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Quotation</th><th>Customer</th><th>Stage</th><th class="num">Total (VAT inc)</th></tr></thead>
      <tbody>${qp.map((r) => `<tr>
        <td><a href="/quotation.html?id=${r.id}">${esc(r.quote_no)}</a></td>
        <td>${esc(r.customer_name)}</td>
        <td><span class="pill ${QPILL[r.status]}">${QL[r.status]}</span><br><span style="color:var(--ink-soft);font-size:.82rem">${QNOTE[r.status]}</span></td>
        <td class="num">${money(r.total)}</td></tr>`).join('')}</tbody></table></div>` : '';
  pending.innerHTML = billsHtml + quotesHtml
    || '<div class="empty">Nothing waiting. Start a billing period when this month’s readings are in.</div>';

  document.getElementById('overdue').innerHTML = d.overdue.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Client</th><th>Due</th><th class="num">Balance</th></tr></thead>
      <tbody>${d.overdue.map((b) => `<tr>
        <td><a href="/bill.html?id=${b.id}">${esc(b.client_name)}</a></td>
        <td>${dateText(b.due_date)}</td>
        <td class="num">${money(b.total_due)}</td></tr>`).join('')}</tbody></table></div>`
    : '<div class="empty">No overdue balances.</div>';

  const cs = getComputedStyle(document.body);
  Chart.defaults.font.family = cs.fontFamily;
  Chart.defaults.font.size = 12;
  Chart.defaults.color = '#52635e';
  statusChart(d.clients_by_status);
  barChart(d.monthly);
})().catch((e) => toast(e.message, true));
</script>
</body>
</html>
