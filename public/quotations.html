<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quotations — M-Carbon System</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
<div class="shell">
  <aside class="rail"></aside>
  <main>
    <div class="page-head" style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap">
      <div><h1>Quotations</h1>
      <p>Quotes for clients who buy outright, with no contract or monthly billing. A billing officer prepares each one, Finance / HR accepts or declines it, then sends it to the client.</p></div>
      <a class="btn primary" id="new-btn" href="/quotation.html" data-edit>New quotation</a>
    </div>
    <div class="panel">
      <header style="display:flex;gap:10px;flex-wrap:wrap">
        <input id="q" type="search" placeholder="Search quote no. or customer" style="max-width:280px">
        <select id="status" style="max-width:180px"><option value="">All statuses</option></select>
      </header>
      <div id="list"></div>
    </div>
  </main>
</div>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script>
const g = (id) => document.getElementById(id);
const PILL = { draft: 'draft', for_review: 'for_review', approved: 'approved', declined: 'void', sent: 'final', accepted: 'final', paid: 'issued' };
let LABEL = {};
let me;
async function load() {
  const p = new URLSearchParams({ q: g('q').value, status: g('status').value });
  const d = await api('/api/quotations?' + p);
  LABEL = d.labels;
  if (g('status').options.length === 1) d.statuses.forEach((s) => g('status').add(new Option(LABEL[s], s)));
  g('list').innerHTML = d.quotations.length ? `<table><thead><tr>
      <th>Quote no.</th><th>Date</th><th>Customer</th><th>Valid until</th><th class="num">Total (VAT inc)</th><th>Status</th><th></th></tr></thead><tbody>` +
    d.quotations.map((r) => `<tr>
      <td><a href="${me.role === 'viewer' ? '/quotation-print.html' : '/quotation.html'}?id=${r.id}">${esc(r.quote_no)}</a></td><td>${dateText(r.quote_date)}</td>
      <td>${esc(r.customer_name)}${r.client_ref_id ? `<div style="font-size:.82rem;color:var(--ink-soft)">${esc(r.client_ref_id)}</div>` : ''}</td>
      <td>${dateText(r.valid_until)}</td><td class="num">${money(r.total)}</td>
      <td><span class="pill ${PILL[r.status]}">${esc(LABEL[r.status] || r.status)}</span></td>
      <td class="actions"><a class="btn" href="/quotation-print.html?id=${r.id}">View quotation</a></td></tr>`).join('') + '</tbody></table>'
    : `<div class="empty">${me.role === 'viewer' ? 'No quotations have been sent to you yet.' : 'No quotations yet. Create one to get started.'}</div>`;
}
(async () => {
  me = await shell();
  if (readOnly(me)) g('new-btn').hidden = true; // only a billing officer or administrator prepares quotations
  if (me.role === 'viewer') {
    document.querySelector('.page-head p').textContent = 'Quotations prepared for you.';
  }
  g('q').oninput = () => { clearTimeout(g('q')._t); g('q')._t = setTimeout(load, 250); };
  g('status').onchange = load;
  load();
})();
</script>
</body>
</html>
