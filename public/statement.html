<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Billing statement — M-Carbon</title>
<link rel="stylesheet" href="/css/app.css">
<style>
  main { max-width: 900px; margin: 0 auto; }

  /* ---- Billing statement: bordered-box layout, A4 portrait ---- */
  .bs {
    --line: #000;
    background: #fff; color: #000; margin: 0 auto; max-width: 794px;
    padding: 30px 32px 36px; border: 1px solid var(--rule);
    font: 12px/1.3 Arial, "Liberation Sans", Helvetica, sans-serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .bs h1 { font: 700 22px/1.1 Arial, "Liberation Sans", Helvetica, sans-serif; letter-spacing: 0; margin: 0 0 8px; }
  .bs .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
  .bs .meta { font-size: 11px; line-height: 1.35; }
  .bs .draft-flag { color: #b00020; font-weight: 700; margin-top: 4px; }
  .bs .logo { height: 44px; width: auto; display: block; }

  .bs .grid {
    display: grid; grid-template-columns: minmax(0, 43fr) minmax(0, 51fr);
    column-gap: 6%; margin-top: 18px;
  }
  .bs .label { margin: 0 0 6px; font-size: 12px; }
  .bs .box { border: 1px solid var(--line); }
  .bs .stack > * + * { margin-top: 18px; }

  .bs .billed { padding: 6px 8px; line-height: 1.2; }
  .bs .billed div { overflow-wrap: anywhere; }
  .bs .head-right { display: flex; align-items: stretch; gap: 16px; margin-top: -8px; }
  .bs .total { flex: 1; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 14px 8px; }
  .bs .total b { font-weight: 400; font-size: 19px; }
  .bs .due-date { width: 110px; text-align: center; padding-top: 12px; }
  .bs .due-date b { display: block; font-weight: 400; font-size: 14px; margin-top: 10px; }
  .bs .billed-wrap { align-self: end; }

  .bs table { border-collapse: collapse; width: 100%; font-size: 12px; }
  .bs td { border: 1px solid var(--line); padding: 5px 8px; vertical-align: middle; text-align: left; }
  .bs tbody tr:last-child td { border-bottom: 1px solid var(--line); }
  .bs td.v { width: 46%; }
  .bs .acct td.v { width: 34%; text-align: right; }
  .bs .comp td.v { width: 40%; text-align: right; white-space: nowrap; }
  .bs td.ind { padding-left: 16px; }
  .bs td.part { font-weight: 700; }

  .bs .chart { height: 100px; padding: 4px; }
  .bs .chart svg { width: 100%; height: 100%; display: block; }
  .bs .chart .none { height: 100%; display: flex; align-items: center; justify-content: center; color: #666; font-size: 11px; }

  .bs .pay ul { margin: 0; padding: 0; list-style: none; }
  .bs .pay li { padding-left: 32px; position: relative; margin: 3px 0; }
  .bs .pay-ico { position: absolute; left: 10px; top: 1px; width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .bs .pay-d { white-space: pre-line; font-size: 11px; }

  .bs .note { margin-top: 24px; font-size: 10px; color: #333; }

  /* No fixed paper size here — this lets the statement follow whatever paper
     size/orientation the user picks in the print dialog (A4, Letter, Legal, …)
     instead of forcing A4. #print-fit below scales the whole statement down,
     if needed, so it still lands on exactly one page on that paper.

     Margins are set to 0 here deliberately, with the whitespace built in as
     real CSS padding on .bs instead. The print dialog's own margin preset
     is unreliable — different browsers/printers treat "Default" very
     differently, and there's no way for this page to know which one is in
     effect. Keeping our own padding and asking for the dialog's "None" /
     "No margins" option means the whitespace you see is always exactly
     what this stylesheet says, not a guess. */
  @page { margin: 0; }
  @media print {
    html, body { height: auto; }
    .bs { border: 0; padding: 22px 26px 28px; max-width: none; }
    main { max-width: none; }
  }
  @media (max-width: 720px) {
    .bs { padding: 16px; overflow-x: auto; }
    .bs .grid { grid-template-columns: 1fr; row-gap: 22px; }
    .bs .head-right { margin-top: 0; }
  }
</style>
<link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
<div class="shell">
  <aside class="rail"></aside>
  <main>
    <div class="page-head no-print">
      <div>
        <div class="crumb"><a href="/bills.html">Billing</a> / <a id="back" href="#">Worksheet</a></div>
        <h1>Billing statement</h1>
      </div>
      <div class="actions">
        <button class="primary" onclick="printStatement()">Print or save as PDF</button>
        <div style="font-size:11px;color:#666;margin-top:6px;max-width:260px;">Tip: in the print dialog, set Margins to "None" for the cleanest one-page fit.</div>
      </div>
    </div>
    <div id="print-fit"><div id="doc"></div></div>
  </main>
</div>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');

/* Shown only until at least one active method is added under "Payment method". */
const FALLBACK_PAYMENT_METHODS = [
  { name: 'Via direct online payment….' },
  { name: 'Via check collected by…' }
];

/* Small line icons for each payment method on the statement. They are SVG
   strokes in the text colour, so they print crisply even when the print
   dialog's "Background graphics" option is off. Picked from the method name. */
const PAY_ICONS = {
  bank: '<path d="M3 21h18"/><path d="M5 21V10M9.5 21V10M14.5 21V10M19 21V10"/><path d="M2 10 12 4l10 6z"/>',
  cheque: '<rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M6 10h7M6 14h4M15 14.5l1.2 1.2 2.3-2.6"/>',
  cash: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v.01M18 14.5v.01"/>',
  card: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
  phone: '<rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/>',
  globe: '<circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19"/><path d="M12 2.5c2.7 2.7 4 5.9 4 9.5s-1.3 6.8-4 9.5c-2.7-2.7-4-5.9-4-9.5s1.3-6.8 4-9.5z"/>',
  coins: '<circle cx="9" cy="9" r="6"/><path d="M15.2 9.3A6 6 0 1 1 9.3 15.2"/><path d="M9 6.5v5M7.5 8h3"/>'
};
function payIcon(name) {
  const n = (name || '').toLowerCase();
  let k = 'coins';
  if (/(gcash|maya|paymaya|wallet|paypal|e-?wallet|gotyme)/.test(n)) k = 'phone';
  else if (/(cheque|check)/.test(n)) k = 'cheque';
  else if (/(bank|transfer|bdo|bpi|metrobank|security|landbank|unionbank|pnb|rcbc|eastwest|instapay|pesonet)/.test(n)) k = 'bank';
  else if (/(cash|over the counter|counter)/.test(n)) k = 'cash';
  else if (/(card|credit|debit|visa|master)/.test(n)) k = 'card';
  else if (/(online|web|portal|internet)/.test(n)) k = 'globe';
  return `<svg class="pay-ico" viewBox="0 0 24 24" aria-hidden="true">${PAY_ICONS[k]}</svg>`;
}

const METHODS = {
  fixed: 'Method 1 - Fixed baseline',
  savings_pct: 'Method 2 - Savings %',
  operating_hours: 'Method 3 - Operating hours'
};

const addr = addrLine;

const peso = (n) => PESO + ' ' + dec(n, 0);
const kwhs = (n) => Number(n || 0).toLocaleString(LOCALE(), { maximumFractionDigits: 3 }) + ' kWh';
const dt = (d) => new Date(d + 'T00:00:00');
const longDate = (d) => d ? dt(d).toLocaleDateString(LOCALE(), { month: 'long', day: 'numeric', year: 'numeric' }) : '—';
const dmy = (d) => {
  if (!d) return '—';
  const x = dt(d);
  return String(x.getDate()).padStart(2, '0') + '-' + x.toLocaleDateString(LOCALE(), { month: 'short' }) + '-' + x.getFullYear();
};
const monthLabel = (d) => dt(d).toLocaleDateString(LOCALE(), { month: 'short' }) + ' ' + String(dt(d).getFullYear()).slice(2);
const compact = (n, short) => short && Math.abs(n) >= 10000 ? Math.round(n / 1000) + 'k' : Math.round(n).toLocaleString(LOCALE());

/** Simple bar chart (inline SVG) — one bar per billing period. */
function barChart(rows, key, color) {
  if (!rows.length) return '<div class="none">No data yet</div>';
  const W = 340, H = 110, L = 34, R = 6, T = 14, B = 20;
  const max = Math.max(...rows.map((r) => Number(r[key]) || 0), 1);
  const slot = (W - L - R) / rows.length;
  const bw = Math.min(28, slot * 0.6);
  const y = (v) => T + (H - T - B) * (1 - Math.max(v, 0) / max);
  let g = `<line x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}" stroke="#000" stroke-width="0.8"/>
           <line x1="${L}" y1="${T}" x2="${L}" y2="${H - B}" stroke="#000" stroke-width="0.8"/>
           <text x="${L - 4}" y="${T + 3}" text-anchor="end" font-size="8">${esc(compact(max, rows.length > 8))}</text>
           <text x="${L - 4}" y="${H - B + 3}" text-anchor="end" font-size="8">0</text>
           <text x="4" y="${(T + H - B) / 2}" font-size="7" transform="rotate(-90 4 ${(T + H - B) / 2})" text-anchor="middle" fill="#444">kWh</text>`;
  rows.forEach((r, i) => {
    const v = Number(r[key]) || 0;
    const cx = L + slot * i + slot / 2;
    g += `<rect x="${cx - bw / 2}" y="${y(v)}" width="${bw}" height="${Math.max(H - B - y(v), 0)}" fill="${color}"/>
          <text x="${cx}" y="${y(v) - 3}" text-anchor="middle" font-size="8">${esc(compact(v, rows.length > 8))}</text>
          <text x="${cx}" y="${H - B + 11}" text-anchor="middle" font-size="8">${esc(monthLabel(r.period_end))}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" font-family="Arial, Liberation Sans, Helvetica, sans-serif" role="img">${g}</svg>`;
}

(async () => {
  await shell();
  const b = await api('/api/bills/' + id);
  const configured = await api('/api/payment-methods?active=1').catch(() => []);
  const payMethods = configured.length ? configured : FALLBACK_PAYMENT_METHODS;
  document.getElementById('back').href = '/bill.html?id=' + b.id;
  document.title = b.statement_no + ' — Billing statement';

  const primary = b.contacts.find((c) => c.is_primary) || b.contacts[0];
  const rates = b.rate_breakdown || [];
  const prev = b.previous_bill;
  const other = Number(b.adjustments_total || 0) + Number(b.interest_charged || 0);
  const isDraft = ['draft', 'for_review', 'approved', 'void'].includes(b.status);

  const rateRows = rates.length <= 1
    ? `<tr><td>Applicable electricity rate (Grid)</td><td class="v">${peso(rates[0] ? rates[0].rate : 0)}</td></tr>`
    : rates.map((r) => `<tr><td>${esc(r.label)} (${peso(r.rate)}/kWh × ${esc(kwhs(r.kwh))})</td><td class="v">${peso(r.value)}</td></tr>`).join('');

  document.getElementById('doc').innerHTML = `
  <article class="bs">
    <div class="top">
      <div>
        <h1>BILLING STATEMENT</h1>
        <div class="meta">Statement No: ${esc(b.statement_no)}<br>Statement Date: ${esc(longDate(b.bill_date))}
          ${isDraft ? `<div class="draft-flag">${esc(b.status_label).toUpperCase()} — NOT FOR RELEASE</div>` : ''}</div>
      </div>
      <img class="logo" src="/img/mirae-esp-logo.png" alt="Mirae ESP Inc">
    </div>

    <div class="grid">
      <div class="billed-wrap">
        <p class="label">Billed To:</p>
        <div class="box billed">
          <div>${esc(b.client.name.toUpperCase())}</div>
          ${addr(b.client) ? `<div>${esc(addr(b.client).toUpperCase())}</div>` : ''}
          <div>Account Number: ${esc(b.client.account_no)}</div>
          <div>TIN: ${esc(b.client.tin || '—')}</div>
          <div>Attention: ${esc(primary ? primary.name : '—')}</div>
        </div>
      </div>
      <div class="head-right">
        <div class="box total"><span>TOTAL AMOUNT DUE:</span><b>PHP ${dec(b.total_due)}</b></div>
        <div class="due-date">DUE DATE:<b>${esc(dmy(b.due_date))}</b></div>
      </div>

      <div class="stack" style="margin-top:22px">
        <div>
          <p class="label">Usage Profile:</p>
          <table>
            <tr><td class="v">Project/site:</td><td>${esc(b.project.name)}</td></tr>
            <tr><td class="v">Address:</td><td>${esc(b.project.address || '—')}</td></tr>
            <tr><td class="v">Device/s:</td><td>${b.devices.length}</td></tr>
            <tr><td class="v">Lighting quantity:</td><td>${esc(b.project.lighting_qty ?? '—')}</td></tr>
            <tr><td class="v">Data collection period:</td><td>${esc(longDate(b.period_start))} - ${esc(longDate(b.period_end))}</td></tr>
            <tr><td class="v">Data collection days:</td><td>${b.days}</td></tr>
            <tr><td class="v">Bill date:</td><td>${esc(longDate(b.bill_date))}</td></tr>
            <tr><td class="v">Data source:</td><td>${b.source === 'manual' ? 'Manual/standalone mode' : 'M-Carbon Dashboard'}</td></tr>
            <tr><td class="v">Previous consumption:</td><td>${prev ? esc(kwhs(prev.actual_kwh)) : '—'}</td></tr>
            <tr><td class="v">Current consumption:</td><td>${esc(kwhs(b.actual_kwh))}</td></tr>
            <tr><td class="v">Previous kWh savings:</td><td>${prev ? esc(kwhs(prev.energy_savings_kwh)) : '—'}</td></tr>
            <tr><td class="v">Current kWh savings:</td><td>${esc(kwhs(b.energy_savings_kwh))}</td></tr>
          </table>
        </div>
        <div>
          <p class="label">Monthly Energy Consumption Graph</p>
          <div class="box chart">${barChart(b.history || [], 'actual_kwh', '#2b2f8f')}</div>
        </div>
        <div>
          <p class="label">Monthly Energy Savings Graph</p>
          <div class="box chart">${barChart(b.history || [], 'energy_savings_kwh', '#2b2f8f')}</div>
        </div>
      </div>

      <div class="stack" style="margin-top:22px">
        <div>
          <p class="label">Account Summary:</p>
          <table class="acct">
            <tr><td>Advanced Payments &amp; Credits</td><td class="v">${peso(b.payments_total)}</td></tr>
            <tr><td>Balance from Previous Billing</td><td class="v">${peso(b.previous_balance)}</td></tr>
            <tr><td>Billing Adjustment/s${Number(b.interest_charged) ? ' (incl. late payment interest)' : ''}</td><td class="v">${peso(other)}</td></tr>
            <tr><td>Current Charges Amount</td><td class="v">${peso(b.amount_billed)}</td></tr>
            <tr><td>Current Charges Due Date</td><td class="v">${esc(dmy(b.due_date))}</td></tr>
            <tr><td>Total Amount Due</td><td class="v">${peso(b.total_due)}</td></tr>
          </table>
        </div>
        <div>
          <p class="label">Computation Breakdown:</p>
          <table class="comp">
            <tr><td class="part" colspan="2">Part I - Baseline Computation and Savings</td></tr>
            <tr><td class="ind">Baseline computation method</td><td class="v">${esc(METHODS[b.baseline_method] || b.baseline_method)}</td></tr>
            <tr><td class="ind">Calculate baseline consumption</td><td class="v">${esc(kwhs(b.baseline_kwh))}</td></tr>
            <tr><td class="ind">Actual M-Carbon consumption</td><td class="v">${esc(kwhs(b.actual_kwh))}</td></tr>
            <tr><td class="ind">Energy Savings</td><td class="v">${esc(kwhs(b.energy_savings_kwh))}</td></tr>
            <tr><td class="part" colspan="2">Part II - Electricity Rates</td></tr>
            ${rateRows}
            <tr><td>Gross energy cost savings</td><td class="v">${peso(b.gross_savings)}</td></tr>
            <tr><td>Mirae ESP share (${+Number(b.ines_pct).toFixed(2)}%)</td><td class="v">${peso(b.amount_billed)}</td></tr>
            <tr><td>Client retained savings (${+Number(b.client_pct).toFixed(2)}%)</td><td class="v">${peso(b.client_retained)}</td></tr>
          </table>
        </div>
        <div class="pay">
          <p class="label">Payment Methods:</p>
          <ul>${payMethods.map((m) => `<li>${payIcon(m.name)}${esc(m.name)}${m.details ? `<div class="pay-d">${esc(m.details)}</div>` : ''}</li>`).join('')}</ul>
        </div>
      </div>
    </div>
    ${b.notes || b.source === 'manual' ? `<div class="note">${b.source === 'manual' ? 'Consumption data for this period was entered manually (standalone mode). ' : ''}${b.notes ? 'Note: ' + esc(b.notes) : ''}</div>` : ''}
  </article>`;
  requestAnimationFrame(fitStatementToPage);
})().catch((e) => toast(e.message, true));

/* Scale the statement down (never up) so it always lands on a single printed
   page, whatever paper size is chosen in the print dialog. We can't ask the
   browser what paper size was picked, so instead we target the tightest
   available space across the common sizes (A4/Letter/Legal, portrait, 10mm
   margins): the narrowest usable width (A4) and the shortest usable height
   (Letter) — that box fits inside all three. Small safety margin included.

   IMPORTANT: this uses the CSS `zoom` property, not `transform: scale()`.
   `transform` only changes how a box is painted — the browser's print
   engine still fragments/paginates the page using the box's original,
   UNSCALED size, so a visually-shrunk statement can still split across two
   pages (or leave a blank second page) even though it looks like it fits.
   `zoom` instead triggers a real reflow at the smaller size, so the box the
   paginator sees is genuinely smaller — that's what actually keeps it to
   one page.

   Target: with margins set to 0 (see @page above) and the print dialog's
   margin preset set to "None"/"No margins", the whitespace comes entirely
   from .bs's own CSS padding, which is already included in the height we
   measure below. So the target here is close to the true physical page
   size (A4's width, Letter's height — the tightest of the common sizes),
   just short of it as a small safety pad against printer-driver rounding. */
const DESIGN_W = 794;  // statement's normal design width in CSS px (~210mm)
const SAFE_W = 784;    // just under A4's full width (793.7px), safety pad only
const SAFE_H = 1046;   // just under Letter's full height (1056px), safety pad only

function fitStatementToPage() {
  const wrap = document.getElementById('print-fit');
  const el = wrap && wrap.querySelector('.bs');
  if (!el) return;
  el.style.zoom = 1;
  el.style.width = DESIGN_W + 'px';
  const h = el.getBoundingClientRect().height;
  if (!h) return;
  const scale = Math.min(1, SAFE_W / DESIGN_W, SAFE_H / h);
  el.style.zoom = scale < 1 ? scale : 1;
}

/* Some Chromium builds generate the print preview from a snapshot that's
   taken before styles set inside a 'beforeprint' handler are reliably
   reflected (a known timing quirk), which is why the scaling could silently
   fail to apply even though the listener below is also in place as a
   fallback for Ctrl+P / the browser's own print menu. Calling
   fitStatementToPage() synchronously, right here in the button handler,
   guarantees the shrink is committed to the DOM before window.print() ever
   asks the browser to paginate. */
function printStatement() {
  fitStatementToPage();
  window.print();
}
window.addEventListener('beforeprint', fitStatementToPage);
window.addEventListener('afterprint', () => {
  const el = document.querySelector('#print-fit .bs');
  if (el) { el.style.zoom = ''; el.style.width = ''; }
});
</script>
</body>
</html>
