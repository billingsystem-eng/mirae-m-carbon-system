<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quotation — M-Carbon System</title>
<link rel="stylesheet" href="/css/app.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 14px; }
  .wide { grid-column: 1 / -1; }
  .items td { padding: 6px; vertical-align: top; }
  .items textarea { min-height: 74px; }
  .totals { margin-left: auto; width: 320px; max-width: 100%; }
  .totals div { display: flex; justify-content: space-between; padding: 4px 0; }
  .totals .t { border-top: 1px solid var(--rule-strong); font-weight: 600; font-size: 1.05rem; margin-top: 4px; padding-top: 8px; }
</style>
<link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
<div class="shell">
  <aside class="rail"></aside>
  <main>
    <div class="page-head" style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap">
      <div><div class="crumb"><a href="/quotations.html">Quotations</a></div><h1 id="title">New quotation</h1></div>
      <div class="actions">
        <span id="state" class="pill draft" hidden></span>
        <span id="wf" style="display:contents"></span>
        <a class="btn" id="view-btn" href="#" hidden>View quotation</a>
      </div>
    </div>

    <div class="panel" id="decline-note" hidden style="border-left:4px solid var(--alert)">
      <div style="padding:12px 16px"><b>Declined by Finance / HR</b><p id="decline-text" style="margin:6px 0 0;white-space:pre-line"></p></div>
    </div>

    <div class="panel"><header><h2>Customer</h2></header><div class="body grid" style="padding:16px">
      <div><label>Client (needed to send it to them)</label><select id="client_id" data-edit><option value="">— Not linked —</option></select></div>
      <div><label>Customer or company name</label><input id="customer_name" data-edit></div>
      <div><label>Project site (if applicable)</label><input id="project_site" data-edit></div>
      <div><label>Client reference ID (PR no.)</label><input id="client_ref_id" data-edit></div>
      <div><label>Quotation date</label><input id="quote_date" type="date" data-edit></div>
      <div><label>Valid until</label><input id="valid_until" type="date" data-edit></div>
      <div><label>VAT rate (%)</label><input id="vat_rate" type="number" min="0" max="100" step="0.01" value="12" data-edit></div>
      <div><label>Submitted by</label><input id="submitted_by" data-edit></div>
      <div><label>Contact number</label><input id="contact_no" data-edit></div>
    </div></div>

    <div class="panel"><header><h2>Items</h2></header>
      <div style="overflow-x:auto"><table class="items"><thead><tr>
        <th style="width:42px">Item #</th><th>Description</th><th style="width:100px">Unit</th><th style="width:90px">Quantity</th>
        <th style="width:130px">Unit - Material Cost (₱)</th><th style="width:130px">Unit - Labor Cost (₱)</th><th class="num" style="width:130px">Total</th><th style="width:60px"></th></tr></thead>
        <tbody id="rows"></tbody></table></div>
      <div style="padding:12px 16px"><button type="button" id="add-row" data-edit>Add item</button></div>
      <div class="totals" style="padding:0 16px 16px">
        <div><span>Sub total (VAT ex)</span><span id="t-sub"></span></div>
        <div><span id="t-vat-l">Add: VAT</span><span id="t-vat"></span></div>
        <div class="t"><span>Total (VAT inc)</span><span id="t-total"></span></div>
      </div>
    </div>

    <div class="panel"><header><h2>Terms and signatories</h2></header><div class="body grid" style="padding:16px">
      <div class="wide"><label>Terms and conditions</label><textarea id="terms" rows="9" data-edit></textarea></div>
      <div><label>Prepared by — name</label><input id="prepared_by_name" data-edit></div>
      <div><label>Prepared by — designation</label><input id="prepared_by_title" data-edit></div>
      <div><label>Approved by — name</label><input id="approved_by_name" data-edit></div>
      <div><label>Approved by — designation</label><input id="approved_by_title" data-edit></div>
      <div><label>Footer contact — name</label><input id="contact_name" data-edit></div>
      <div><label>Footer contact — phone</label><input id="contact_phone" data-edit></div>
      <div><label>Footer contact — email</label><input id="contact_email" data-edit></div>
    </div></div>

    <div class="panel" id="approvals" hidden>
      <header><h2>Approval</h2></header>
      <div class="body" id="approvals-body" style="padding:16px"></div>
    </div>

    <div class="panel" id="invoice-panel" hidden>
      <header><h2>Sales invoice (scanned copy)</h2></header>
      <div class="body" id="invoice-body"></div>
    </div>

    <div class="actions">
      <button class="primary" id="save" data-edit>Save quotation</button>
      <button class="danger" id="del" data-edit hidden>Delete</button>
    </div>
  </main>
</div>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script>
const g = (id) => document.getElementById(id);
const FIELDS = ['client_id','customer_name','project_site','client_ref_id','quote_date','valid_until','vat_rate','submitted_by','contact_no','terms',
  'prepared_by_name','prepared_by_title','approved_by_name','approved_by_title','contact_name','contact_phone','contact_email'];
const id = new URLSearchParams(location.search).get('id');
let me, clients = [], defs, q = null;
const iso = (d) => d.toISOString().slice(0, 10);

function rowHtml(i = {}, n = 0) {
  return `<tr><td class="no">${n + 1}</td>
    <td><textarea class="d" data-edit>${esc(i.description || '')}</textarea></td>
    <td><input class="u" value="${esc(i.unit || 'pieces')}" data-edit></td>
    <td><input class="q" type="number" min="0" step="any" value="${i.quantity ?? 1}" data-edit></td>
    <td><input class="m" type="number" min="0" step="any" value="${i.unit_material ?? ''}" data-edit></td>
    <td><input class="l" type="number" min="0" step="any" value="${i.unit_labor ?? ''}" data-edit></td>
    <td class="num lt"></td>
    <td><button type="button" class="quiet danger rm" data-edit>Remove</button></td></tr>`;
}
function recalc() {
  let sub = 0;
  [...g('rows').rows].forEach((tr, n) => {
    tr.querySelector('.no').textContent = n + 1;
    const t = (Number(tr.querySelector('.q').value) || 0) * ((Number(tr.querySelector('.m').value) || 0) + (Number(tr.querySelector('.l').value) || 0));
    tr.querySelector('.lt').textContent = money(t); sub += t;
  });
  const rate = Number(g('vat_rate').value) || 0, vat = Math.round(sub * rate) / 100;
  g('t-sub').textContent = money(sub);
  g('t-vat-l').textContent = `Add: ${rate}% VAT`;
  g('t-vat').textContent = money(vat);
  g('t-total').textContent = money(sub + vat);
}
function addRow(i) { g('rows').insertAdjacentHTML('beforeend', rowHtml(i, g('rows').rows.length)); recalc(); }
function collect() {
  const b = {}; FIELDS.forEach((f) => (b[f] = g(f).value));
  b.items = [...g('rows').rows].map((tr) => ({ description: tr.querySelector('.d').value, quantity: tr.querySelector('.q').value,
    unit: tr.querySelector('.u').value, unit_material: tr.querySelector('.m').value, unit_labor: tr.querySelector('.l').value }));
  return b;
}
function fill(q) {
  FIELDS.forEach((f) => (g(f).value = q[f] ?? ''));
  g('rows').innerHTML = ''; q.items.forEach(addRow); recalc();
}
// Flow (like a billing statement): Draft -> For review -> Accepted (Finance / HR) -> Sent to client -> Paid.
// Finance / HR can also decline a quotation in review, with a reason; the billing officer fixes it and sends it again.
const PILL = { draft: 'draft', for_review: 'for_review', approved: 'approved', declined: 'void', sent: 'final', accepted: 'final', paid: 'issued' };
const WAIT = {
  draft: 'Waiting for the billing officer to send it for review.',
  declined: 'Declined. The billing officer needs to fix it and send it for review again.',
  for_review: 'Waiting for Finance / HR to accept or decline it.',
  approved: 'Accepted. Waiting for Finance / HR to send it to the client.',
  sent: 'With the client. Mark it as paid when payment arrives, then attach the Sales Invoice.',
  accepted: 'The client has accepted. Mark it as paid when payment arrives, then attach the Sales Invoice.',
  paid: 'Paid.'
};
const can = (...roles) => roles.includes(me.role);

function setLocked(on, why) {
  document.querySelectorAll('[data-edit]').forEach((el) => { el.disabled = on; el.title = on ? why : ''; });
  g('save').hidden = on;
}

function renderWorkflow() {
  const s = q.status, parts = [];
  if (can('admin', 'billing_officer') && ['draft', 'declined'].includes(s)) parts.push(`<button class="primary" id="wf-review">${s === 'declined' ? 'Send for review again' : 'Send for review'}</button>`);
  if (can('finance_hr') && s === 'for_review') parts.push('<button class="primary" id="wf-accept">Accept</button>');
  if (can('finance_hr') && s === 'approved') parts.push('<button class="primary" id="wf-send">Send to client</button>');
  if (can('finance_hr') && ['for_review', 'approved'].includes(s)) parts.push('<button class="danger" id="wf-decline">Decline</button>');
  if (can('finance_hr', 'admin') && ['sent', 'accepted'].includes(s)) parts.push('<button class="primary" id="wf-paid">Mark as paid</button>');
  g('wf').innerHTML = parts.join('');
  if (g('wf-review')) g('wf-review').onclick = () => move('for_review');
  if (g('wf-accept')) g('wf-accept').onclick = () => move('approved');
  if (g('wf-send')) g('wf-send').onclick = () => {
    if (confirm(`Send ${q.quote_no} to ${q.customer_name}? The client will see it in their login.`)) move('sent');
  };
  if (g('wf-decline')) g('wf-decline').onclick = () => {
    const reason = prompt('Why is this quotation being declined? The billing officer will see this and fix it.');
    if (reason === null) return;
    if (!reason.trim()) return toast('A reason is required.', true);
    move('declined', reason.trim());
  };
  if (g('wf-paid')) g('wf-paid').onclick = () => move('paid');
}

function renderApprovals() {
  const s = q.status;
  const by = (who, at) => who ? `<b>${esc(who)}</b> · ${esc(at || '')}` : '';
  const reviewed = ['approved', 'sent', 'accepted', 'paid'].includes(s);
  const rows = [
    ['Prepared and sent for review', 'Billing officer / Administrator', s !== 'draft' ? 'ok' : '', s !== 'draft' ? esc(q.submitted_at || '') : ''],
    ['Finance review', 'Finance / HR', reviewed ? 'ok' : s === 'declined' ? 'no' : '',
      reviewed ? by(q.reviewed_by, q.reviewed_at) + ' · accepted' : s === 'declined' ? by(q.reviewed_by, q.reviewed_at) + ' · declined' : ''],
    ['Sent to client', 'Finance / HR', ['sent', 'accepted', 'paid'].includes(s) ? 'ok' : '', by(q.sent_by, q.sent_at)],
    ['Paid', 'Finance / HR or administrator', s === 'paid' ? 'ok' : '', '']
  ];
  const mark = { ok: '✓', no: '✕', '': '○' };
  g('approvals-body').innerHTML = `<table><tbody>${rows.map(([name, role, st, info]) => `<tr>
      <td style="width:26px">${mark[st]}</td><td><b>${name}</b><br><span style="font-size:.82rem;color:var(--ink-soft)">${role}</span></td>
      <td style="text-align:right">${info || (st ? '' : '<span style="color:var(--ink-soft)">Pending</span>')}</td></tr>`).join('')}</tbody></table>
    <p style="margin:10px 0 0;color:var(--ink-soft);font-size:.86rem">${WAIT[s] || ''}</p>`;
}

/** Everything that depends on the quotation's current status. */
function render() {
  g('title').textContent = q.quote_no;
  g('state').className = 'pill ' + PILL[q.status]; g('state').textContent = q.status_label; g('state').hidden = false;
  g('decline-note').hidden = !(q.status === 'declined' && q.decline_reason);
  g('decline-text').textContent = q.decline_reason ? `${q.decline_reason}${q.reviewed_by ? '\n— ' + q.reviewed_by : ''}` : '';
  g('approvals').hidden = false;
  renderWorkflow(); renderApprovals();
  g('view-btn').href = '/quotation-print.html?id=' + id; g('view-btn').hidden = false;
  if (readOnly(me)) setLocked(true, 'Your role is read-only.');
  else if (!q.editable) setLocked(true, 'Locked while it is under review or after it has been accepted. Finance / HR can decline it to send it back.');
  else setLocked(false);
  g('del').hidden = !id || readOnly(me) || !(q.editable || me.role === 'admin');
  g('del').disabled = false; g('del').title = '';
  renderInvoicePanel('quotation', id, me);
}

async function saveQuote(silent) {
  const r = await api(id ? '/api/quotations/' + id : '/api/quotations', { method: id ? 'PUT' : 'POST', body: collect() });
  if (!silent) toast('Quotation saved');
  return r;
}

async function move(status, reason) {
  try {
    if (q.editable && !readOnly(me)) q = await saveQuote(true); // send what is on screen, not an older save
    q = await api(`/api/quotations/${id}/status`, { method: 'PATCH', body: { status, reason } });
    fill(q); render();
    toast('Now ' + q.status_label.toLowerCase());
  } catch (e) { toast(e.message, true); }
}

(async () => {
  me = await shell();
  const [d, cl] = await Promise.all([api('/api/quotations/defaults'), api('/api/clients')]);
  defs = d; clients = cl.clients;
  clients.forEach((c) => g('client_id').add(new Option(c.name, c.id)));
  g('client_id').onchange = () => { const c = clients.find((x) => String(x.id) === g('client_id').value); if (c) g('customer_name').value = c.name; };
  g('rows').oninput = recalc; g('vat_rate').oninput = recalc;
  g('rows').onclick = (e) => { if (e.target.classList.contains('rm')) { e.target.closest('tr').remove(); recalc(); } };
  g('add-row').onclick = () => addRow();
  if (id) {
    q = await api('/api/quotations/' + id);
    fill(q); render();
  } else {
    const t = new Date(), v = new Date(); v.setDate(v.getDate() + 30);
    FIELDS.forEach((f) => (g(f).value = ''));
    g('quote_date').value = iso(t); g('valid_until').value = iso(v); g('vat_rate').value = 12;
    g('terms').value = defs.terms; g('submitted_by').value = me.full_name; g('prepared_by_name').value = me.full_name;
    addRow();
    if (readOnly(me)) setLocked(true, 'Your role is read-only.');
  }
  g('save').onclick = async () => {
    try {
      const r = await saveQuote();
      if (!id) location.href = '/quotation.html?id=' + r.id;
      else { q = r; fill(q); render(); }
    } catch (e) { toast(e.message, true); }
  };
  g('del').onclick = async () => {
    if (!confirm('Delete this quotation? This can’t be undone.')) return;
    try { await api('/api/quotations/' + id, { method: 'DELETE' }); location.href = '/quotations.html'; } catch (e) { toast(e.message, true); }
  };
})();
</script>
</body>
</html>
