<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quotation — M-Carbon System</title>
<link rel="stylesheet" href="/css/app.css">
<style>
  main { max-width: 900px; margin: 0 auto; }
  .qt { --navy: #2b3480; background: #fff; color: #000; margin: 0 auto; max-width: 794px; padding: 26px 30px 22px;
    border: 1px solid var(--rule); font: 12px/1.3 Arial, "Liberation Sans", Helvetica, sans-serif;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .qt table { border-collapse: collapse; width: 100%; font-size: 12px; }
  .qt td, .qt th { padding: 3px 6px; border: 0; vertical-align: top; }
  .qt .logo { height: 68px; display: block; margin-bottom: 18px; }
  .qt .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; }
  .qt .addr { flex: 1 1 52%; } .qt .addr td:first-child { width: 86px; }
  .qt .meta { flex: 0 0 280px; margin-top: 8px; }
  .qt .bar { background: var(--navy); color: #fff; font-weight: 700; padding: 4px 8px; }
  .qt .bar.big { font-size: 15px; text-align: center; padding: 5px; }
  .qt .meta td { border: 1px solid #c9cde0; padding: 3px 6px; } .qt .meta td:first-child { border-right: 0; white-space: nowrap; }
  .qt .meta td:last-child { border-left: 0; font-size: 10.5px; }
  .qt .to { width: 215px; margin-top: 16px; } .qt .custname { padding: 3px 6px; border-bottom: 1px solid #c9cde0; margin-bottom: 14px; }
  .qt .custname .site { margin-top: 3px; font-size: 11px; }
  .qt .items th { word-break: keep-all; background: var(--navy); color: #fff; text-align: center; border: 1px solid var(--navy); }
  .qt .items td { border-left: 1px solid #c9cde0; border-right: 1px solid #c9cde0; }
  .qt .items tr.fill td { height: 22px; } .qt .items tr.fill:nth-child(even) td { background: #f1f1f1; }
  .qt .items td.c { text-align: center; } .qt .items td.r { text-align: right; white-space: nowrap; }
  .qt .items .desc { white-space: pre-wrap; }
  .qt .items .nf td { text-align: center; font-style: italic; background: #f1f1f1; border-top: 1px solid #c9cde0; border-bottom: 1px solid #c9cde0; font-size: 11px; }
  .qt .items { border-bottom: 1px solid #c9cde0; }
  .qt .low { display: flex; justify-content: space-between; gap: 22px; margin-top: 12px; }
  .qt .terms { flex: 1 1 52%; border: 1px solid #c9cde0; padding: 4px 6px; font-size: 10px; min-height: 190px; white-space: pre-wrap; }
  .qt .terms b { display: block; font-size: 12px; font-weight: 400; margin-bottom: 3px; }
  .qt .sum { flex: 0 0 280px; } .qt .sum td { border-bottom: 1px solid #c9cde0; } .qt .sum td:last-child { text-align: right; }
  .qt .sum .tot td { background: var(--navy); color: #fff; font-weight: 700; border: 0; }
  .qt .sum .words td { background: var(--navy); color: #fff; font-size: 7.5px; font-style: italic; text-align: right; padding: 0 6px 5px; border: 0; }
  .qt .sig { margin-top: 18px; text-align: center; } .qt .sig .ln { text-align: left; margin-bottom: 4px; }
  .qt .sig .ln span { display: inline-block; border-bottom: 1px solid #000; width: 190px; }
  .qt .sig p { margin: 5px 0; font-size: 12px; }
  .qt footer { margin-top: 18px; border-top: 1px solid #c9cde0; padding-top: 6px; text-align: center; font-style: italic; font-size: 10.5px; }
  @page { size: A4; margin: 10mm; }
  @media print { .qt { border: 0; padding: 0; max-width: none; } }
</style>
<link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
<div class="shell">
  <aside class="rail"></aside>
  <main>
    <div class="page-head no-print" style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
      <div><div class="crumb"><a href="/quotations.html">Quotations</a></div><h1>Quotation</h1></div>
      <div class="actions"><a class="btn" id="edit" href="#">Edit</a><button class="primary" onclick="window.print()">Print or save as PDF</button></div>
    </div>
    <p id="state" class="no-print" style="margin:0 0 10px;color:var(--ink-soft)" hidden></p>
    <div id="doc" class="qt"></div>
  </main>
</div>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
const mdy = (d) => d ? d.slice(5, 7) + '/' + d.slice(8, 10) + '/' + d.slice(0, 4) : '';
const P = (n) => PESO + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
(async () => {
  const me = await shell();
  if (!id) return;
  const [q, defs] = await Promise.all([api('/api/quotations/' + id), api('/api/quotations/defaults')]);
  if (LANG === 'ko' && q.terms === defs.terms) q.terms = defs.terms_ko;
  document.title = q.quote_no + ' — M-Carbon';
  document.getElementById('edit').href = '/quotation.html?id=' + id;
  const edit = document.getElementById('edit');
  if (me.role === 'viewer') edit.hidden = true;
  else if (readOnly(me)) edit.textContent = 'Review / send'; // Finance / HR opens the workflow page
  if (me.role !== 'viewer' && !['sent', 'accepted', 'paid'].includes(q.status)) {
    const st = document.getElementById('state');
    st.textContent = `Status: ${q.status_label}. The client can't see this quotation until Finance / HR sends it.`; st.hidden = false;
  }
  const fills = Math.max(0, 8 - q.items.length - 1);
  const rows = q.items.map((i, n) => `<tr><td class="c">${n + 1}</td><td class="desc">${esc(i.description)}</td>
      <td class="c">${esc(i.unit)}</td><td class="c">${Number(i.quantity)}</td><td class="r">${P(i.unit_material)}</td><td class="r">${P(i.unit_labor)}</td><td class="r">${P(i.line_total)}</td></tr>`).join('');
  const blanks = '<tr class="fill"><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>'.repeat(fills);
  document.getElementById('doc').innerHTML = `
    <img class="logo" src="/img/mirae-esp-logo.png" alt="Mirae ESP Inc">
    <div class="head">
      <div class="addr"><table>
        <tr><td colspan="2">서울특별시 금천구 두산로 70, A동 1712호</td></tr><tr><td colspan="2">(독산동, 현대지식산업센터)</td></tr>
        <tr><td colspan="2">TEL : 02-6265-0414</td></tr><tr><td colspan="2">E-mail : mirae@mirae-esp.com</td></tr>
        <tr><td colspan="2">Website : www.mirae-esp.com</td></tr></table></div>
      <div class="meta"><div class="bar big">QUOTATION</div><table>
        <tr><td>Quotation No.:</td><td>${esc(q.quote_no)}</td></tr><tr><td>Date:</td><td>${mdy(q.quote_date)}</td></tr>
        <tr><td>Valid Until:</td><td>${mdy(q.valid_until)}</td></tr><tr><td>Client Ref. ID:</td><td>${esc(q.client_ref_id)}</td></tr></table></div>
    </div>
    <div class="to"><div class="bar">QUOTE TO</div></div><div class="custname">${esc(q.customer_name)}${q.project_site ? `<div class="site">Project Site: ${esc(q.project_site)}</div>` : ''}</div>
    <table class="items"><thead><tr><th style="width:44px">Item #</th><th>Description</th><th style="width:54px">Unit</th><th style="width:60px">Quantity</th>
      <th style="width:78px">Unit - Material Cost</th><th style="width:78px">Unit - Labor Cost</th><th style="width:86px">Total</th></tr></thead>
      <tbody>${rows}<tr class="nf"><td colspan="7">--- nothing follows ---</td></tr>${blanks}</tbody></table>
    <div class="low">
      <div class="terms"><b>Terms and Conditions:</b>${esc(q.terms)}</div>
      <div class="sum"><table>
        <tr><td>Sub Total (VAT Ex)</td><td>${P(q.subtotal)}</td></tr><tr><td>Add: ${Number(q.vat_rate)}% VAT</td><td>${P(q.vat)}</td></tr>
        <tr class="tot"><td>Total (VAT Inc)</td><td>${P(q.total)}</td></tr></table>
        <div class="sig"><div class="ln">Prepared by : <span></span></div><p>${esc(q.prepared_by_name)}</p><p>${esc(q.prepared_by_title)}</p>
        <div class="ln" style="margin-top:22px">Approved by : <span></span></div><p>${esc(q.approved_by_name)}</p><p>${esc(q.approved_by_title)}</p></div></div>
    </div>`;
})();
</script>
</body>
</html>
